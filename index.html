/* ============================================================
   소식 — 커피 매체의 최신 글 (저장 담당 server.js 의 /news 가 모아 준다)
   저장 담당이 꺼져 있으면 마지막으로 받아 둔 글을 보여준다 (이 브라우저에만 보관)
   ============================================================ */

var K_NEWS = LSK + "-news";          // 마지막으로 받은 목록 — 백업 대상 아님
var NEWS_URL = "http://127.0.0.1:8765/news";
var NEWS_SKIP = { mocha: 1, java: 1, bourbon: 1, kona: 1 };   // 품종보다 다른 뜻으로 더 자주 쓰이는 이름
var news = { data: null, src: "all", busy: false, err: "", offline: false, picking: false, pickMsg: "" };
var PICK_POLL_MS = 4000;
var newsNames = null;

function newsCacheGet() {
  try { var r = localStorage.getItem(K_NEWS); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function newsCacheSet(d) {
  try { localStorage.setItem(K_NEWS, JSON.stringify(d)); } catch (e) { /* 자리가 없으면 기억만 못 한다 */ }
}

/* 이 컴퓨터의 도감(파일 · 저장 담당 주소)인지 — 아니면 발행본(폰 등)이다 */
function isLocalApp() { return location.protocol === "file:" || location.hostname === "127.0.0.1"; }
/* 소식을 PC 에서 담아 온 판인지 — 발행본 · 폰용 파일(커피도감_폰.html). 저장 담당을 찾지 않는다 */
function newsFromPC() { return !!window.NEWS_SNAPSHOT || !isLocalApp(); }

function loadNews(fresh) {
  if (news.busy) return;
  /* 발행본 · 폰용 파일 — 저장 담당에 닿을 수 없으니 PC 에서 담아 온 소식을 보여준다 (tools/publish-phone.js) */
  if (newsFromPC()) {
    var snap = window.NEWS_SNAPSHOT || null;
    news.data = snap;
    news.err = snap
      ? "PC에서 담아 온 소식이에요(" + agoShort(snap.updatedAt) + " 기준). 새 소식은 PC에서 폰용 파일을 다시 만들면 바뀌어요."
      : "소식은 PC의 도감에서 받아 와요.";
    renderNews();
    return;
  }
  news.busy = true; news.err = "";
  renderNews();
  fetch(NEWS_URL + (fresh ? "?fresh=1" : ""), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !Array.isArray(d.items)) throw new Error("형식");
      news.data = d; news.offline = false;
      newsCacheSet(d);
    })
    .catch(function () {
      news.offline = true;
      if (!news.data) news.data = newsCacheGet();
      news.err = news.data
        ? "저장 담당 프로그램이 꺼져 있어 마지막으로 받아 둔 글을 보여줍니다."
        : "저장 담당 프로그램이 꺼져 있어 소식을 받지 못했습니다. 컴퓨터를 다시 켜거나 ‘커피 도감 열기’로 열어 주세요.";
    })
    .then(function () { news.busy = false; renderNews(); });
}

/* 글에 나온 도감 품종 — 영문 이름으로 찾는다 (길이 5자 이상, 뜻이 겹치는 이름 제외) */
function newsVarietyNames() {
  if (newsNames) return newsNames;
  var list = [];
  VARIETIES.forEach(function (v) {
    String(v.en || "").split("/").forEach(function (n) {
      n = n.replace(/\(.*?\)/g, "").trim();
      if (n.length < 5 || NEWS_SKIP[n.toLowerCase()]) return;
      list.push({ id: v.id, ko: v.ko, re: new RegExp("\\b" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i"), len: n.length });
    });
  });
  newsNames = list.sort(function (a, b) { return b.len - a.len; });
  return newsNames;
}
function mentionsOf(it) {
  var text = it.title + " " + it.excerpt, seen = {}, out = [];
  newsVarietyNames().forEach(function (n) {
    if (out.length >= 3 || seen[n.id] || !n.re.test(text)) return;
    seen[n.id] = 1; out.push(n);
  });
  return out;
}

function agoShort(iso) {
  var t = Date.parse(iso);
  if (!t) return "";
  var m = Math.floor((Date.now() - t) / 60000);
  if (m < 60) return Math.max(1, m) + "분 전";
  if (m < 48 * 60) return Math.floor(m / 60) + "시간 전";
  if (m < 30 * 1440) return Math.floor(m / 1440) + "일 전";
  var d = new Date(t);
  return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
}

function newsCardHTML(it) {

  var img = it.image

  return '<article class="nw' + (it.lang === "ko" ? " ko" : "") + '">' +

/* ── Claude 가 고른 글 (소식_추천.json → /news 의 picks) ── */
function pickHTML(p, lead) {

/* 새로 고르기 — 저장 담당이 Claude Code 를 불러 고른다 (도감 주소로 열었을 때만) */
function pickBtnHTML() {

    : "추천은 PC에서 매주 새로 골라요. 폰에서는 발행할 때의 추천이 보여요.") + "</p>";
  return '<div class="pks-act">' +

    (news.pickMsg ? "<span>" + esc(news.pickMsg) + "</span>" : "<span>매주 월요일 아침에도 알아서 새로 골라요</span>") +
  "</div>";
}
function startPicking() {
  if (news.picking) return;
  fetch(SRV_URL + "picks/refresh", { method: "POST" }).then(function (r) {
    return r.json().then(function (j) { return { s: r.status, j: j }; });
  }).then(function (x) {

      news.picking = true; news.pickMsg = "새 글을 받고 읽느라 1~2분쯤 걸려요. 이 화면을 떠나도 계속 골라요.";
      renderNews(); pollPicking(); return;
    }

    renderNews();
  }).catch(function () { news.pickMsg = "저장 담당 프로그램이 꺼져 있어요."; renderNews(); });
}
function pollPicking() {
  setTimeout(function () {
    fetch(SRV_URL + "picks/status", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (st) {

      news.picking = false;
      if (st.lastErr) { news.pickMsg = "이번엔 고르지 못했어요 · 이전 추천을 그대로 둬요"; renderNews(); return; }
      news.pickMsg = "새 추천이 도착했어요";
      news.data = null; news.busy = false; news.err = "";
      loadNews(false);
    }).catch(function () { news.picking = false; news.pickMsg = "저장 담당 프로그램과 연결이 끊겼어요."; renderNews(); });
  }, PICK_POLL_MS);

function picksHTML(pk) {

function renderNews() {

      (nKo ? '<button data-nwsrc="ko" aria-pressed="' + (news.src === "ko") + '">한국어</button>' +
             '<button data-nwsrc="en" aria-pressed="' + (news.src === "en") + '">영어</button>' +
             '<span class="nw-sep" aria-hidden="true"></span>' : "") +
      srcs.map(function (s) {

    "</div>" +
    (!newsFromPC() ? '<button class="btn sm" data-nwfresh="1"' + (news.busy ? " disabled" : "") + ">" + (news.busy ? "받는 중…" : "새로 받기") + "</button>" : "") +

  }

  if (!shown.length) {

      ? '<div class="empty"><div class="big">소식을 받는 중입니다</div></div>'

  } else {
    html += '<div class="nw-grid">' + shown.map(newsCardHTML).join("") + "</div>";
    html += '<p class="nw-foot">글을 누르면 원문이 새 창으로 열립니다. 제목과 요약은 각 매체의 RSS에서 가져옵니다.</p>';

/* ===== 26-backup.js ===== */
/* ============================================================
   백업 — 파일로 저장 · 파일에서 복원 · 연결해 둔 파일에 자동 저장

   세 가지 길을 둔다.
   1) 백업 파일을 한 번 지정해 두면  → 기록이 바뀔 때마다 그 파일에 조용히 덮어쓴다
   2) 파일 지정을 지원하지 않는 브라우저 → 날짜가 붙은 파일로 내려받는다
   3) 그마저 막힌 환경            → 예전처럼 텍스트를 복사해 둔다

   그리고 0) — 저장 담당 프로그램(server.js)이 켜져 있으면 도감을 그쪽 주소로 옮겨 연다.
   그때는 브라우저 권한 없이 그 프로그램이 파일에 쓰므로 ‘허용’을 누를 일이 없다.
   ============================================================ */

var BK_KEY  = LSK + "-bk";      // { at, sig, name } — 마지막 백업 기록
var BK_UNDO = LSK + "-undo";    // 복원 직전 스냅샷
var BK_IDB  = "coffee-atlas-fs";

var SRV_URL  = "http://127.0.0.1:8765/";
var SRV_FILE = "커피도감_백업.json";
var SERVED   = location.protocol === "http:" && location.hostname === "127.0.0.1" && location.port === "8765";
var WEBAPP   = !!window.COFFEE_WEBAPP;    // 휴대폰 웹 앱(웹앱\index.html) — PC 저장 담당을 찾지 않는다
var srvUp    = false;    // file:// 로 열었을 때 — 저장 담당 프로그램이 켜져 있는지
var srvAgain = false;    // 쓰는 도중에 또 바뀌었는지
var srvWarned = false;

var CAN_FS   = !SERVED && typeof window.showSaveFilePicker === "function";
var bkHandle = null;     // 연결해 둔 백업 파일
var bkGranted = false;   // 그 파일에 쓸 권한을 확인했는지
var bkBusy = false;
var bkTimer = null;
var bkPending = null;    // 끌어다 놓은 파일 — 확인을 받고 나서 덮어쓴다

/* ── 백업 내용 ────────────────────────────────── */
function backupJSON() {
  return JSON.stringify({
    app: "coffee-atlas", version: 1, exportedAt: new Date().toISOString(),
    varieties: { edits: UD.edits, hidden: UD.hidden },
    tastings: LOGS,
    favorites: state.fav
  }, null, 2);
}

/* 내용이 달라졌는지만 보는 짧은 지문 — 시각(exportedAt)은 넣지 않는다 */
function bkSig() { return sigOf(LOGS, UD.edits, UD.hidden, state.fav); }
function sigOf(logs, edits, hidden, fav) {
  var s = JSON.stringify([logs, edits, hidden, fav]);
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return s.length + "." + h.toString(36);
}

function bkMeta() {
  try { var r = localStorage.getItem(BK_KEY); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
/* lsSet 을 쓰지 않는다 — 백업 기록 자체가 또 백업을 부르면 끝이 없다 */
function bkSaveMeta(m) {
  try { localStorage.setItem(BK_KEY, JSON.stringify(m)); } catch (e) { /* 저장 불가 환경 */ }
}
function bkDirty() {
  var m = bkMeta();
  return !m || m.sig !== bkSig();
}
function bkCounts() {
  return { log: LOGS.length, var: Object.keys(UD.edits).length, fav: Object.keys(state.fav).length };
}
function bkEmpty() {
  var c = bkCounts();
  return !c.log && !c.var && !c.fav && !Object.keys(UD.hidden).length;
}

function agoKo(iso) {
  var t = Date.parse(iso);
  if (!t) return "언제인지 알 수 없음";
  var m = Math.floor((Date.now() - t) / 60000);
  if (m < 2) return "방금";
  if (m < 60) return m + "분 전";
  if (m < 48 * 60) return Math.floor(m / 60) + "시간 전";
  return Math.floor(m / 1440) + "일 전";
}

/* ── 파일 손잡이 보관 (IndexedDB) ─────────────── */
function idbOpen() {
  return new Promise(function (res, rej) {
    try {
      var r = indexedDB.open(BK_IDB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("h"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    } catch (e) { rej(e); }
  });
}
function idbDo(mode, fn) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction("h", mode);
      var rq = fn(tx.objectStore("h"));
      tx.oncomplete = function () { db.close(); res(rq ? rq.result : null); };
      tx.onerror = function () { db.close(); rej(tx.error); };
    });
  });
}
function bkRemember(h) { return idbDo("readwrite", function (s) { return s.put(h, "backup"); }); }
function bkRecall()    { return idbDo("readonly",  function (s) { return s.get("backup"); }); }
function bkForget()    { return idbDo("readwrite", function (s) { return s.delete("backup"); }); }

/* ── 권한 ─────────────────────────────────────── */
function bkPerm(ask) {
  if (!bkHandle) return Promise.resolve("denied");
  if (!bkHandle.queryPermission) return Promise.resolve("granted");
  var opt = { mode: "readwrite" };
  return Promise.resolve(bkHandle.queryPermission(opt)).then(function (p) {
    if (p === "granted" || !ask) return p;
    return bkHandle.requestPermission(opt);
  }).catch(function () { return "denied"; });
}

/* ── 연결해 둔 파일에 쓰기 ────────────────────── */
function bkWrite(silent) {
  if (SERVED) return srvWrite(silent);
  if (!bkHandle || bkBusy) return Promise.resolve(false);
  bkBusy = true;
  var text = backupJSON(), sig = bkSig(), name = bkHandle.name;

  return bkPerm(!silent).then(function (p) {
    if (p !== "granted") {
      bkGranted = false;
      renderBkStatus();
      bkBar(true);
      if (!silent) toast("파일에 쓸 권한이 없습니다. 위쪽 ‘허용’을 눌러 주세요.");
      return false;
    }
    bkGranted = true;
    return Promise.resolve(bkHandle.createWritable()).then(function (w) {
      return Promise.resolve(w.write(text)).then(function () { return w.close(); });
    }).then(function () {
      bkSaveMeta({ at: new Date().toISOString(), sig: sig, name: name });
      renderBkStatus();
      bkBar(false);
      if (srvUp) { location.replace(SRV_URL); return true; }   // 밀린 기록을 파일에 넣었으니 이제 옮겨 연다
      if (!silent) toast("백업했습니다 · " + name);
      return true;
    });
  }).catch(function () {
    bkGranted = false;
    renderBkStatus();
    bkBar(true);
    if (!silent) toast("파일에 쓰지 못했습니다. 파일을 다시 지정해 주세요.");
    return false;
  }).then(function (ok) { bkBusy = false; return ok; });
}

/* ── 저장 담당 프로그램에 쓰기 (http://127.0.0.1:8765) ── */
function srvWrite(silent, keepalive) {
  if (bkBusy) { srvAgain = true; return Promise.resolve(false); }
  var text = backupJSON(), sig = bkSig(), m = bkMeta();
  if (silent && m && m.sig === sig && bkGranted) return Promise.resolve(true);   // 이미 같은 내용
  bkBusy = true;

  return fetch(SRV_URL + "backup", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: text, keepalive: !!keepalive && text.length < 60000
  }).then(function (r) {
    if (r.status === 409) {
      toast("기록이 비어 있어 백업 파일은 그대로 두었습니다. ‘백업 불러오기’로 되살릴 수 있습니다.");
      return false;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    bkGranted = true; srvWarned = false;
    bkSaveMeta({ at: new Date().toISOString(), sig: sig, name: SRV_FILE });
    renderBkStatus();
    if (!silent) toast("백업했습니다 · " + SRV_FILE);
    return true;
  }).catch(function () {
    bkGranted = false;
    renderBkStatus();
    if (!silent || !srvWarned) {
      srvWarned = true;
      toast("저장 담당 프로그램이 꺼져 있습니다 — 폴더의 ‘커피 도감 열기’로 다시 열어 주세요.");
    }
    return false;
  }).then(function (ok) {
    bkBusy = false;
    if (srvAgain) { srvAgain = false; markDirty(); }
    return ok;
  });
}

/* 도감 주소로 열었을 때 — 파일과 브라우저 중 새로운 쪽에 맞춘다 */
function srvInit() {
  bkGranted = true;
  fetch(SRV_URL + "backup", { cache: "no-store" }).then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (txt) {
    var d = null;
    try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = null; }
    if (!d || d.app !== "coffee-atlas") {        // 파일이 없거나 깨졌다 → 지금 것으로 새로 쓴다
      renderBkStatus();
      if (!bkEmpty()) srvWrite(true);
      return;
    }
    var v = d.varieties || {};
    var fileSig = sigOf(Array.isArray(d.tastings) ? d.tastings : [], v.edits || {}, v.hidden || {}, d.favorites || {});
    if (fileSig === bkSig()) {
      bkSaveMeta({ at: d.exportedAt || new Date().toISOString(), sig: fileSig, name: SRV_FILE });
      renderBkStatus();
      return;
    }
    var m = bkMeta();
    var fileNewer = bkEmpty() || !m || Date.parse(d.exportedAt || 0) > Date.parse(m.at);
    if (fileNewer) applyBackup(txt, "백업 파일에서 기록 " + (d.tastings || []).filter(isCupLog).length + "개를 불러왔습니다.");
    else srvWrite(true);
  }).catch(function () {
    bkGranted = false;
    renderBkStatus();
  });
}

/* file:// 로 열었을 때 — 저장 담당 프로그램이 켜져 있는지만 잠깐 묻는다 */
function srvProbe() {
  if (location.protocol !== "file:" || !window.fetch) return Promise.resolve(false);
  var ask = fetch(SRV_URL + "ping", { cache: "no-store" })
    .then(function (r) { return r.ok; }, function () { return false; });
  var wait = new Promise(function (res) { setTimeout(function () { res(false); }, 900); });
  return Promise.race([ask, wait]);
}

/* ── 백업 파일 지정 (첫 1회) ──────────────────── */
function bkConnect() {
  if (!CAN_FS) { bkDownload(); return; }
  var opt = {
    suggestedName: "커피도감_백업.json",
    types: [{ description: "커피 도감 백업", accept: { "application/json": [".json"] } }]
  };
  Promise.resolve(window.showSaveFilePicker(opt)).then(function (h) {
    bkHandle = h; bkGranted = true;
    return bkRemember(h).catch(function () { /* 기억은 못 해도 이번 저장은 된다 */ })
      .then(function () { return bkWrite(false); });   // 권한이 필요하면 여기서 물어본다
  }).then(function (ok) {
    if (!ok) return;
    closeEditor();
    renderBkStatus();
    toast("이제 기록이 바뀌면 이 파일에 자동으로 저장됩니다 · " + bkHandle.name);
  }).catch(function (e) {
    if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) return;  // 사용자가 취소
    toast("파일을 만들 수 없어 내려받기로 저장합니다.");
    bkDownload();
  });
}

function bkDisconnect() {
  bkHandle = null; bkGranted = false;
  bkForget().catch(function () {});
  renderBkStatus();
  toast("자동 저장을 껐습니다. 백업은 직접 눌러야 합니다.");
}

/* ── 휴대폰 — 공유 창으로 내보내기 (파일에 저장 · 카톡 · 메일) ── */
function bkCanShare(file) {
  try {
    return window.matchMedia("(pointer:coarse)").matches && !!navigator.canShare && navigator.canShare({ files: [file] });
  } catch (e) { return false; }
}
function bkShare(file, sig) {
  navigator.share({ files: [file], title: file.name }).then(function () {
    bkSaveMeta({ at: new Date().toISOString(), sig: sig, name: file.name });
    renderBkStatus();
    toast("백업을 내보냈습니다 · " + file.name);
  }).catch(function (e) {
    if (e && e.name === "AbortError") return;   // 공유 창을 그냥 닫음
    toast("공유가 막혔습니다. 아래 내용을 복사해 두세요.");
    openBackup("export");
  });
}

/* ── 내려받기 (파일 지정이 안 되는 곳) ────────── */
function bkDownload() {
  try {
    var text = backupJSON(), sig = bkSig();
    var name = "커피도감_백업_" + todayStr() + ".json";
    var file = typeof File === "function" ? new File([text], name, { type: "application/json" }) : null;
    if (file && bkCanShare(file)) { bkShare(file, sig); return true; }
    var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    bkSaveMeta({ at: new Date().toISOString(), sig: sig, name: name });
    renderBkStatus();
    toast("백업 파일을 내려받았습니다 · " + name);
    return true;
  } catch (e) {
    openBackup("export");
    toast("자동 저장이 막혔습니다. 아래 내용을 복사해 두세요.");
    return false;
  }
}

/* ── 버튼 하나로 백업 ─────────────────────────── */
function quickBackup() {
  if (bkEmpty()) { toast("아직 백업할 기록이 없습니다."); return; }
  if (SERVED || bkHandle) { bkWrite(false); return; }
  if (CAN_FS) { bkConnect(); return; }
  bkDownload();
}

/* ── 파일에서 복원 ────────────────────────────── */
function bkPickFile() {
  if (CAN_FS && window.showOpenFilePicker) {
    Promise.resolve(window.showOpenFilePicker({
      multiple: false,
      types: [{ description: "커피 도감 백업", accept: { "application/json": [".json"], "text/plain": [".txt"] } }]
    })).then(function (list) {
      var h = list[0];
      return h.getFile().then(function (f) { return f.text(); }).then(function (txt) {
        if (!applyBackup(txt)) return;
        /* 되살린 파일을 그대로 자동 저장 대상으로 — 다시 지정할 일이 없다 */
        if (h.createWritable && !SERVED) {
          bkHandle = h; bkGranted = true;
          bkRemember(h).catch(function () {});
          renderBkStatus();
        }
      });
    }).catch(function (e) {
      if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) return;
      bkFileInput();
    });
    return;
  }
  bkFileInput();
}

/* 파일 선택창 — 폰과 사파리까지 두루 통하는 길 */
function bkFileInput() {
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,.txt,application/json,text/plain";
  inp.style.position = "fixed";
  inp.style.left = "-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change", function () {
    var f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    bkReadFile(f, true);
  });
  inp.click();
}

function bkReadFile(file, apply) {
  var fr = new FileReader();
  fr.onload = function () {
    var txt = String(fr.result || "");
    if (apply) { applyBackup(txt); return; }
    /* 끌어다 놓은 파일 — 무엇이 들었는지 보여주고 누를 때 덮어쓴다 */
    bkPending = { name: file.name, text: txt, info: bkPeek(txt) };
    openBackup("import");
  };
  fr.onerror = function () { toast("파일을 읽지 못했습니다."); };
  fr.readAsText(file);
}

/* 덮어쓰기 전에 파일 안을 들여다본다 */
function bkPeek(text) {
  var d;
  try { d = JSON.parse(text); } catch (e) { return null; }
  if (!d || d.app !== "coffee-atlas") return null;
  return {
    log: Array.isArray(d.tastings) ? d.tastings.filter(isCupLog).length : 0,
    vars: d.varieties && d.varieties.edits ? Object.keys(d.varieties.edits).length : 0,
    fav: d.favorites ? Object.keys(d.favorites).length : 0,
    at: (d.exportedAt || "").slice(0, 10)
  };
}

/* ── 복원 ─────────────────────────────────────── */
function applyBackup(raw, msg) {
  var txt = String(raw || "").trim();
  if (!txt) { toast("내용이 비어 있습니다."); return false; }
  var data;
  try { data = JSON.parse(txt); }
  catch (e) { toast("형식이 올바르지 않습니다. 백업 파일 전체를 넣었는지 확인해 주세요."); return false; }
  if (!data || data.app !== "coffee-atlas") { toast("이 도감의 백업 파일이 아닙니다."); return false; }

  /* 덮어쓰기 전에 지금 것을 한 번 접어둔다 — 잘못 불러와도 되돌릴 수 있게 */
  try { localStorage.setItem(BK_UNDO, JSON.stringify({ at: new Date().toISOString(), data: JSON.parse(backupJSON()) })); }
  catch (e) { /* 자리가 없으면 되돌리기만 없다 */ }

  UD.edits  = (data.varieties && data.varieties.edits)  || {};
  UD.hidden = (data.varieties && data.varieties.hidden) || {};
  /* 예전 5점제 기록은 커핑 기록과 섞지 않는다 — 한쪽에 접어두기만 한다 (21-tasting.js) */
  var all = Array.isArray(data.tastings) ? data.tastings : [];
  var oldN = all.filter(function (x) { return !isCupLog(x); }).length;
  LOGS = all.filter(isCupLog);
  if (oldN) stashOldLogs(all.filter(function (x) { return !isCupLog(x); }));
  state.fav = data.favorites || {};

  saveUD(); saveLogs(); saveStore();
  bkSaveMeta({ at: new Date().toISOString(), sig: bkSig(), name: (bkMeta() || {}).name });
  rebuildVarieties();
  closeEditor();
  renderAll();
  toast((msg || "복원했습니다. 기록 " + LOGS.length + "개를 불러왔습니다.") +
    (oldN ? " (예전 5점제 기록 " + oldN + "개는 넣지 않았습니다)" : ""));
  return true;
}

function bkUndoData() {
  try { var r = localStorage.getItem(BK_UNDO); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function bkUndo() {
  var u = bkUndoData();
  if (!u || !u.data) { toast("되돌릴 내용이 없습니다."); return; }
  applyBackup(JSON.stringify(u.data));
  try { localStorage.removeItem(BK_UNDO); } catch (e) { /* 지우지 못해도 무해 */ }
}

/* ── 상태 줄 ──────────────────────────────────── */
function bkStatusHTML() {
  var m = bkMeta(), dirty = bkDirty() && !bkEmpty();
  var line = m ? "마지막 백업 · " + agoKo(m.at) : "아직 백업한 적 없음";
  var auto = SERVED
    ? (bkGranted ? '<span class="bk-auto" title="' + SRV_FILE + ' 에 자동 저장">자동</span>'
                 : '<span class="bk-auto wait" title="저장 담당 프로그램이 꺼져 있음">자동 · 연결 끊김</span>')
    : !bkHandle ? ""
    : bkGranted ? '<span class="bk-auto" title="' + esc(bkHandle.name) + ' 에 자동 저장">자동</span>'
                : '<span class="bk-auto wait" title="' + esc(bkHandle.name) + '">자동 · 허용 필요</span>';
  return '<div class="bk-status' + (dirty ? " warn" : "") + '" id="bkStatus">' +
    (dirty ? '<span class="bk-dot" aria-hidden="true"></span>' : "") +
    "<span>" + esc(line) + "</span>" + auto + "</div>";
}
/* 권한이 풀렸을 때만 뜨는 줄 — 한 번 눌러 허용하면 사라진다 */
function bkBar(show) {
  var el = $("#bkBar");
  if (!el) return;
  if (!show || !bkHandle) { el.hidden = true; el.innerHTML = ""; return; }
  el.innerHTML = "<span><b>" + esc(bkHandle.name) + "</b> 에 쓸 권한이 풀렸습니다. " +
    "한 번 허용하면 기록이 바뀔 때마다 이 파일에 자동으로 저장됩니다.</span>" +
    '<button class="btn sm primary" data-bkallow="1">허용</button>' +
    '<button class="btn sm" data-bkbarhide="1">나중에</button>';
  el.hidden = false;
}

/* 오른쪽 여백의 「내 데이터」 칸 — 넓은 화면에서만 보인다 (좁으면 CSS 가 숨기고 색인 쪽이 대신) */
function railHTML() {
  var m = bkMeta(), dirty = bkDirty() && !bkEmpty(), c = bkCounts();
  var linked = SERVED || !!bkHandle, auto = linked && bkGranted;
  var where = SERVED ? SRV_FILE : bkHandle ? bkHandle.name : "";

  var badge = !linked ? ""
    : auto ? '<span class="bk-auto">자동 저장</span>'
           : '<span class="bk-auto wait">' + (SERVED ? "연결 끊김" : "허용 필요") + "</span>";
  var when = m ? agoKo(m.at) + " 백업" : "아직 백업 없음";
  var sub = dirty ? (auto ? "곧 저장됩니다" : "저장하지 않은 변경이 있습니다")
          : auto ? "기록이 바뀌면 알아서 저장됩니다"
          : m ? "바뀐 것 없음" : "";

  return '<div class="rail-card' + (dirty && !auto ? " warn" : "") + '">' +
      '<div class="rail-h"><span class="lab">내 데이터</span>' + badge + "</div>" +
      "<div><div class=\"rail-when\">" + esc(when) + "</div>" +
        (sub ? '<div class="rail-sub">' + (dirty && !auto ? '<span class="bk-dot" aria-hidden="true"></span>' : "") + esc(sub) + "</div>" : "") +
      "</div>" +
      '<div class="rail-n">' +
        "<div><b>" + c.log + "</b><span>시음 기록</span></div>" +
        "<div><b>" + c.fav + "</b><span>즐겨찾기</span></div>" +
        "<div><b>" + c.var + "</b><span>고친 품종</span></div>" +
      "</div>" +
      '<button class="btn primary" data-bksave="1" title="Ctrl S">⤓ 지금 백업</button>' +
      '<button class="btn" data-import="1">⤒ 백업 불러오기</button>' +
      (where ? '<div class="rail-where">저장 위치 · <b>' + esc(where) + "</b></div>" : "") +
    "</div>" +
    '<div class="rail-more">' +
      '<button class="reset" data-export="1">백업 설정 · 다른 기기로 옮기기</button>' +
      '<button class="btn sm" data-newvar="1" style="width:auto">＋ 품종 직접 추가</button>' +
    "</div>";
}
function renderRail() {
  var el = $("#rail");
  if (el) el.innerHTML = railHTML();
}

function renderBkStatus() {
  renderRail();
  var el = $("#bkStatus");
  if (!el) return;
  var tmp = document.createElement("div");
  tmp.innerHTML = bkStatusHTML();
  el.parentNode.replaceChild(tmp.firstChild, el);
}

/* 데이터가 저장될 때마다 불린다 (lsSet 안에서) */
function markDirty() {
  renderBkStatus();
  if (!SERVED && (!bkHandle || !bkGranted)) return;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(function () { bkWrite(true); }, 1800);
}

/* ── 백업 화면 ────────────────────────────────── */

  if (mode === "export") {
    bkPending = null;
    var c = bkCounts(), m = bkMeta();

    $("#edSub").textContent = "파일 하나로 옮기고 되살린다";

    html += '<div class="ed-sec"><p class="body-t" style="margin-bottom:12px">' +
      "기록 <b>" + c.log + "</b>개, 직접 고친 품종 <b>" + c.var + "</b>개, 즐겨찾기 <b>" + c.fav + "</b>개가 들어 있습니다. " +
      (m ? "마지막 백업은 " + esc(agoKo(m.at)) + (m.name ? " · <b>" + esc(m.name) + "</b>" : "") + "." : "아직 백업한 적이 없습니다.") +
      "</p>";

    if (SERVED) {
      html += '<div class="bk-note">도감 폴더의 <b>' + SRV_FILE + '</b> 에 자동으로 저장되고 있습니다. ' +

        '<div class="bk-row"><button class="btn primary" data-bksave="1">지금 저장</button>' +

        '<div class="bk-row"><button class="btn primary" data-bksave="1">지금 저장</button>' +
        '<button class="btn" data-bkoff="1">자동 저장 끄기</button></div>';
    } else if (CAN_FS) {
      html += '<div class="bk-note">백업 파일을 한 번 지정해 두면, 그 뒤로는 <b>기록이 바뀔 때마다 알아서 그 파일에 덮어씁니다.</b> ' +

      '<p class="hint" style="margin-bottom:10px">내려받은 파일을 옮겨 <b>백업 불러오기</b>로 열면 그대로 넘어갑니다. ' +
      "파일을 주고받기 어려우면 아래 내용을 복사해 메모 앱에 붙여넣어도 됩니다.</p>" +

      '<textarea class="ta" id="bkText" style="min-height:200px;margin-top:10px;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px" readonly>' +

        '<div class="bk-row"><button class="btn primary" data-bkopen="1">백업 파일 열기</button>' +
        (u ? '<button class="btn" data-bkundo="1">복원 직전으로 되돌리기 (' + esc(agoKo(u.at)) + ")</button>" : "") +
        "</div>" +
        '<div class="bk-drop" id="bkDrop">백업 파일을 여기에 끌어다 놓아도 됩니다</div>' +
        "</div>";
    }

    html += '<div class="ed-sec"><span class="lab">텍스트로 붙여넣기</span>' +
      '<details class="bk-fold"><summary>복사해 둔 내용이 있다면</summary>' +
      '<textarea class="ta" id="bkText" style="min-height:180px;margin-top:10px;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px" placeholder="여기에 붙여넣기"></textarea>' +
      '<div class="bk-row" style="margin-top:9px"><button class="btn sm primary" data-bkload="1">붙여넣은 내용 불러오기</button></div>' +
      "</details></div>";

    html += '<div class="ed-foot"><button class="btn" data-edcancel="1">취소</button></div>';
  }

  $("#edBody").innerHTML = html;
  $("#edBody").scrollTop = 0;
  $("#ed").classList.add("open");
  $("#scrim").classList.add("open");
  $("#ed").focus();
}

function copyBackupText() {
  var ta = $("#bkText");
  if (!ta) return;
  ta.removeAttribute("readonly");
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  var done = false;
  try { done = document.execCommand("copy"); } catch (err) { done = false; }
  ta.setAttribute("readonly", "readonly");
  if (done) { toast("복사했습니다. 메모장에 붙여넣어 보관하세요."); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(
      function () { toast("복사했습니다. 메모장에 붙여넣어 보관하세요."); },
      function () { toast("자동 복사가 막혔습니다. 직접 전체 선택해 복사해 주세요."); }
    );
  } else toast("자동 복사가 막혔습니다. 직접 전체 선택해 복사해 주세요.");
}

/* ── 이벤트 ───────────────────────────────────── */
document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target : e.target.parentNode;
  if (!t || !t.closest) return;

  if (t.closest("[data-bksave]")) { quickBackup(); return; }
  if (t.closest("[data-bkconn]")) { bkConnect(); return; }
  if (t.closest("[data-bkoff]"))  { bkDisconnect(); openBackup("export"); return; }
  if (t.closest("[data-bkdown]")) { bkDownload(); return; }
  if (t.closest("[data-bkopen]")) { bkPickFile(); return; }
  if (t.closest("[data-bkundo]")) { bkUndo(); return; }
  if (t.closest("[data-bkapply]")) {
    if (bkPending) { var txt = bkPending.text; bkPending = null; applyBackup(txt); }
    return;
  }
  if (t.closest("[data-bkdrop]")) { bkPending = null; openBackup("import"); return; }
  if (t.closest("[data-bkallow]")) { bkWrite(false); return; }
  if (t.closest("[data-bkbarhide]")) { bkBar(false); return; }
  if (t.closest("[data-export]")) { openBackup("export"); return; }
  if (t.closest("[data-import]")) { openBackup("import"); return; }
  if (t.closest("[data-bkload]")) { applyBackup($("#bkText") ? $("#bkText").value : ""); return; }
  if (t.closest("[data-bkcopy]")) { copyBackupText(); return; }
});

/* 창 어디에든 백업 파일을 끌어다 놓으면 불러오기 화면이 열린다 */
function dragHasFile(e) {
  var d = e.dataTransfer;
  if (!d) return false;
  var types = d.types ? Array.prototype.slice.call(d.types) : [];
  return types.indexOf("Files") >= 0;
}
window.addEventListener("dragover", function (e) {
  if (!dragHasFile(e)) return;
  e.preventDefault();
  var z = $("#bkDrop");
  if (z) z.classList.add("over");
});
window.addEventListener("dragleave", function () {
  var z = $("#bkDrop");
  if (z) z.classList.remove("over");
});
window.addEventListener("drop", function (e) {
  if (!dragHasFile(e)) return;
  e.preventDefault();
  var z = $("#bkDrop");
  if (z) z.classList.remove("over");
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (!/\.(json|txt)$/i.test(f.name)) { toast("백업 파일(.json)만 읽을 수 있습니다."); return; }
  bkReadFile(f, false);   // 바로 덮어쓰지 않는다 — 확인하고 누르게
});

/* ── 시작할 때 ────────────────────────────────── */
function bkInit() {
  renderRail();
  setInterval(renderRail, 60000);   // 「방금 백업」이 몇 시간째 방금으로 남지 않게
  if (WEBAPP) {
    /* 기록은 이 휴대폰에만 있다 — 브라우저가 저장 공간이 모자랄 때 지우지 않도록 부탁해 둔다 */
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 지원 안 함 */ }
    fileInit();
    return;
  }
  if (SERVED) {
    srvInit();
    /* 창을 닫을 때 1.8초 기다리던 저장을 바로 내보낸다 */
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "hidden" || !bkDirty() || bkEmpty()) return;
      clearTimeout(bkTimer);
      srvWrite(true, true);
    });
    return;
  }
  srvProbe().then(function (up) {
    srvUp = up;
    /* 파일에 다 들어가 있으면 곧장 도감 주소로 — 밀린 기록이 있으면 여기서 먼저 파일에 넣는다 */
    if (up && (bkEmpty() || !bkDirty())) { location.replace(SRV_URL); return; }
    fileInit();
    if (!up) srvWait();
  });
}

/* 컴퓨터를 막 켰을 때 — 도감(크롬)이 저장 담당보다 먼저 열릴 수 있다. 잠시 기다렸다가 켜지면 옮겨 연다 */
var SRV_WAIT_MS = 4000, SRV_WAIT_TRIES = 45;   // 3분
function srvWait() {
  var n = 0;
  var timer = setInterval(function () {
    if (++n > SRV_WAIT_TRIES) { clearInterval(timer); return; }
    srvProbe().then(function (up) {
      if (!up || srvUp) return;
      srvUp = true;
      clearInterval(timer);
      if (bkEmpty() || !bkDirty()) { location.replace(SRV_URL); return; }
      /* 밀린 기록이 있으면 먼저 파일에 넣는다 — 저장이 끝나면 bkWrite 쪽에서 옮겨 연다 */
      if (bkHandle && bkGranted) bkWrite(true);
      else toast("저장 담당이 켜졌습니다 — ‘백업 저장’을 한 번 누르면 자동 백업으로 옮겨 갑니다.");
    });
  }, SRV_WAIT_MS);
}

function fileInit() {
  if (!CAN_FS) { bkRemind(); return; }
  bkRecall().then(function (h) {
    if (!h) { bkRemind(); return null; }
    bkHandle = h;
    return bkPerm(false).then(function (p) {
      bkGranted = (p === "granted");
      renderBkStatus();
      if (!bkGranted) { bkBar(true); return; }   // 허용 줄로 알린다 — 토스트는 생략
      bkRemind();
    });
  }).catch(function () { bkRemind(); });
}

/* 백업하지 않은 변경이 며칠 묵었을 때만 한 번 알린다 */
function bkRemind() {
  if (bkEmpty() || !bkDirty()) return;
  if (bkHandle && bkGranted) { bkWrite(true); return; }   // 연결돼 있으면 조용히 맞춰둔다
  var m = bkMeta();
  var days = m ? (Date.now() - Date.parse(m.at)) / 864e5 : 99;
  if (!(days >= 2)) return;
  setTimeout(function () {
    if (bkEmpty() || !bkDirty()) return;    // 그새 백업했다면 잠자코 넘어간다
    if (bkHandle) {
      toast("백업 파일에 쓸 권한이 풀렸습니다 — ‘백업 저장’을 한 번 눌러 허용해 주세요.");
      return;
    }
    var mm = bkMeta();
    toast(mm ? "마지막 백업이 " + agoKo(mm.at) + "입니다 — ‘내 데이터’의 백업 버튼이나 Ctrl S 를 눌러 주세요."
             : "아직 백업이 없습니다 — ‘내 데이터’의 백업 버튼이나 Ctrl S 로 파일에 남겨두세요.");
  }, 1400);
}


/* ===== 27-map.js ===== */
/* ============================================================
   세계지도 — 품종이 어디서 왔고 어디서 자라는지
   지도 모양은 16-worldmap.js (tools/make-map.js 가 만든다)

   1) 품종 상세 — 재배국을 칠하고, 유래지를 찍고, 전파 경로를 잇는다
   2) 대륙 · 국가 탭 — 나라마다 품종 수를 짙기로 (지금 필터 기준)
   ============================================================ */

var WM = WORLDMAP;
var WM_BINS = [
  { lo: 1,  ko: "1" },
  { lo: 2,  ko: "2–4" },
  { lo: 5,  ko: "5–9" },
  { lo: 10, ko: "10–19" },
  { lo: 20, ko: "20+" }
];
var wmSeq = 0;

function wmBin(n) {
  for (var i = WM_BINS.length - 1; i >= 0; i--) if (n >= WM_BINS[i].lo) return i;
  return -1;
}

/* ‘포르투갈 (CIFC)’ · ‘중앙아프리카’ 같은 유래 표기를 지도 나라 이름으로 */
function wmCountryOf(s) {
  var k = String(s || "").replace(/\s*\(.*$/, "").trim();
  if (k === "중앙아프리카") k = "중앙아프리카공화국";
  return WM.countries[k] ? k : null;
}

/* 보여줄 영역 — 칠한 나라와 찍은 점을 모두 담고, 지도 비율에 맞춰 넓힌다 */
function wmBox(keys, pts) {
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  keys.forEach(function (k) {
    var b = WM.countries[k] && WM.countries[k].b;
    if (!b) return;
    x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]);
  });
  pts.forEach(function (p) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  });
  if (x0 > x1) return [0, 0, WM.w, WM.h];

  var ratio = WM.w / WM.h;
  var w = (x1 - x0) * 1.3 + 30, h = (y1 - y0) * 1.3 + 30;
  w = Math.max(w, h * ratio, 240);
  h = w / ratio;
  if (w >= WM.w * 0.8) return [0, 0, WM.w, WM.h];      // 거의 세계 전체면 그냥 전체로
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  var x = Math.min(Math.max(cx - w / 2, 0), WM.w - w);
  var y = Math.min(Math.max(cy - h / 2, 0), WM.h - h);
  return [x, y, w, h].map(function (n) { return +n.toFixed(1); });
}

/* 두 점을 부드럽게 휜 선으로 — 경로가 겹치지 않게 한쪽으로 휜다 */
function wmArc(a, b) {
  var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var bend = Math.min(len * 0.22, 60);
  var cx = mx - dy / len * bend, cy = my + dx / len * bend;
  return { d: "M" + a.x + "," + a.y + " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + b.x + "," + b.y,
           lx: (mx + cx) / 2, ly: (my + cy) / 2 };
}

/* 지도 한 장
   o.vb     보여줄 영역 [x, y, w, h]
   o.px     화면에서 대략 몇 px 폭으로 그려지는지 — 점과 글자 크기를 맞춘다
   o.fill   나라 → { cls, tip, attr } (없으면 바탕색)
   o.routes [{ a:{x,y}, b:{x,y}, t }]    o.pins [{ x, y, ko, label }] */
function wmSVG(o) {
  var id = "wm" + (++wmSeq);
  var vb = o.vb, u = vb[2] / (o.px || 700);          // 화면 1px 이 지도 좌표로 얼마인지
  var html = '<svg class="wmap" viewBox="' + vb.join(" ") + '" role="img" aria-label="' + esc(o.label || "세계지도") + '">';

  html += '<defs><marker id="' + id + 'a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
    '<path d="M0,1 L9,5 L0,9 z" class="wm-arrow"/></marker></defs>';

  /* 커피 벨트 — 북회귀선과 남회귀선 사이 */
  html += '<rect class="wm-belt" x="0" y="' + WM.belt[0] + '" width="' + WM.w + '" height="' + (WM.belt[1] - WM.belt[0]) + '"/>';
  html += '<path class="wm-trop" d="' + WM.tropics.n + '"/><path class="wm-trop" d="' + WM.tropics.s + '"/>';
  html += '<path class="wm-eq" d="' + WM.tropics.eq + '"/>';
  if (vb[2] > WM.w * 0.6) {
    html += '<text class="wm-belt-t" x="' + (vb[0] + 6 * u) + '" y="' + (WM.belt[0] - 5 * u) + '" style="font-size:' + (10 * u) + 'px">커피 벨트</text>';
  }

  html += '<path class="wm-land" d="' + WM.rest + '"/>';

  var dots = "";
  Object.keys(WM.countries).forEach(function (k) {
    var c = WM.countries[k], f = o.fill && o.fill[k];
    if (!f) { html += '<path class="wm-land" d="' + c.d + '"/>'; return; }
    var attr = ' data-tip="' + esc(f.tip || k) + '"' + (f.attr || "");
    html += '<path class="wm-c ' + f.cls + '" d="' + c.d + '"' + attr + "/>";
    /* 너무 작아 안 보이는 나라는 점을 덧댄다 */
    if (c.s / u < 7) {
      dots += '<circle class="wm-c wm-dot ' + f.cls + '" cx="' + c.c[0] + '" cy="' + c.c[1] + '" r="' + (3.6 * u) + '"' + attr + "/>";
    }
  });
  html += dots;

  /* 경로 — 연도는 지도에 쓰면 겹치므로, 아래 목록과 짝을 이루는 번호만 찍는다 */
  var nums = "";
  (o.routes || []).forEach(function (r, i) {
    var arc = wmArc(r.a, r.b);
    html += '<path class="wm-route" d="' + arc.d + '" marker-end="url(#' + id + 'a)"/>';
    var len = Math.sqrt(Math.pow(r.b.x - r.a.x, 2) + Math.pow(r.b.y - r.a.y, 2)) / u;
    if (len < 26) return;                               // 너무 짧은 선에는 번호를 붙이지 않는다
    nums += '<g class="wm-num" data-tip="' + esc((i + 1) + ". " + (r.a.ko || "") + " → " + (r.b.ko || "") + (r.t ? " · " + r.t : "")) + '">' +
      '<circle cx="' + arc.lx.toFixed(1) + '" cy="' + arc.ly.toFixed(1) + '" r="' + (7 * u) + '"/>' +
      '<text x="' + arc.lx.toFixed(1) + '" y="' + (arc.ly + 3.3 * u).toFixed(1) + '" style="font-size:' + (9.5 * u) + 'px">' + (i + 1) + "</text></g>";
  });

  (o.pins || []).forEach(function (p) {
    html += '<g class="wm-pin" data-tip="' + esc(p.ko) + '">' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (6 * u) + '" class="wm-pin-ring"/>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (2.4 * u) + '" class="wm-pin-dot"/></g>';
    if (p.label) {
      html += '<text class="wm-pt" x="' + (p.x + 9 * u).toFixed(1) + '" y="' + (p.y + 3.5 * u).toFixed(1) + '" style="font-size:' + (10.5 * u) + 'px">' + esc(p.ko) + "</text>";
    }
  });

  return html + nums + "</svg>";
}

/* ── 1) 품종 상세의 지도 ──────────────────────── */
function varietyMapHTML(v, contMap) {
  var D = DETAIL[v.id] || {};
  var main = {}, hasMain = !!(D.main && D.main.length);
  (D.main || []).forEach(function (c) { main[c] = 1; });

  var fill = {}, keys = [];
  (v.grow || []).forEach(function (c) {
    if (!WM.countries[c]) return;
    keys.push(c);
    var isMain = !hasMain || main[c];
    fill[c] = { cls: isMain ? "g-main" : "g-some",
      tip: c + (hasMain ? (main[c] ? " · 주력 재배국" : " · 재배국") : " · 주요 재배국"),
      attr: ' data-country="' + esc(c) + '"' };
  });

  /* 전파 경로 · 유래지 */
  var P = WM.places, routes = [], pins = [], seen = {};
  (D.route || []).forEach(function (r) {
    if (!P[r.a] || !P[r.b]) return;
    routes.push({ a: P[r.a], b: P[r.b], t: r.t });
    [r.a, r.b].forEach(function (k) { if (!seen[k]) { seen[k] = 1; pins.push(P[k]); } });
  });
  if (!pins.length) {
    var pk = D.pin && P[D.pin];
    var bc = wmCountryOf(v.bornC);
    if (pk) pins.push(pk);
    else if (bc) pins.push({ x: WM.countries[bc].c[0], y: WM.countries[bc].c[1], ko: "유래 · " + v.bornC });
  }
  var g = GROUPS[v.grp];
  var style = ' style="--g:' + g.col + '"';
  var zoom = wmBox(keys, pins);

  /* 이름표는 출발점과 도착점에만 — 중간 이름은 아래 목록과 마우스로.
     둘이 화면에서 가까우면 겹치므로 도착점 하나만 */
  var last = pins.length - 1;
  var near = last > 0 && Math.abs(pins[0].x - pins[last].x) / (zoom[2] / 700) < 150 &&
             Math.abs(pins[0].y - pins[last].y) / (zoom[2] / 700) < 22;
  pins = pins.map(function (p, i) {
    return { x: p.x, y: p.y, ko: p.ko, label: i === last || (i === 0 && !near) };
  });
  var isWorld = zoom[2] >= WM.w;
  var common = { fill: fill, routes: routes, pins: pins, label: v.ko + " 재배 지도" };

  var html = '<div class="sec"><span class="lab">어디서 왔고 어디서 자라나</span>' +
    '<div class="wm-wrap"' + style + '>' +
      '<div class="wm-view" data-wmv="zoom">' + wmSVG(Object.assign({ vb: zoom, px: 700 }, common)) + "</div>" +
      (isWorld ? "" : '<div class="wm-view" data-wmv="world" hidden>' + wmSVG(Object.assign({ vb: [0, 0, WM.w, WM.h], px: 700 }, common)) + "</div>") +
    "</div>";

  html += '<div class="wm-legend"' + style + ">" +
    (hasMain
      ? '<span><i class="sw g-main"></i>주력 재배국</span><span><i class="sw g-some"></i>재배국</span>'
      : '<span><i class="sw g-main"></i>주요 재배국</span>') +
    '<span><i class="sw pin"></i>' + (routes.length ? "거쳐 간 곳" : "유래지") + "</span>" +
    (routes.length ? '<span><i class="sw route"></i>전파 경로</span>' : "") +
    (isWorld ? "" : '<button class="reset" data-wmtoggle="1">세계 전체로 보기</button>') +
    "</div>";

  if (routes.length) {
    html += '<ol class="wm-route-list">' + (D.route || []).map(function (r) {
      if (!P[r.a] || !P[r.b]) return "";
      return "<li><span>" + esc(P[r.a].ko) + " → " + esc(P[r.b].ko) + '</span><span class="mono">' + esc(r.t) + "</span></li>";
    }).join("") + "</ol>";
  }

  /* 나라 이름 — 누르면 그 나라 품종만 */
  html += '<div class="wm-countries">' + Object.keys(contMap).map(function (k) {
    return '<div><span class="lab">' + esc(k) + '</span><div class="chips">' + contMap[k].map(function (c) {
      return '<button class="vchip' + (main[c] ? " main" : "") + '" data-country="' + esc(c) + '">' + esc(c) + "</button>";
    }).join("") + "</div></div>";
  }).join("") + '<p class="hint">나라를 누르면 그 나라에서 자라는 품종만 모아 봅니다.</p></div>';

  return html + "</div>";
}

/* ── 2) 대륙 · 국가 탭의 큰 지도 ──────────────── */
function geoMapHTML(byCountry) {
  var fill = {}, max = 0;
  Object.keys(byCountry).forEach(function (c) {
    if (!WM.countries[c]) return;
    var n = byCountry[c].length, b = wmBin(n);
    if (b < 0) return;
    max = Math.max(max, n);
    fill[c] = { cls: "q" + (b + 1), tip: c + " · " + n + "종", attr: ' data-geojump="' + esc(c) + '"' };
  });

  var legend = WM_BINS.map(function (b, i) {
    return '<span><i class="sw q' + (i + 1) + '"></i>' + b.ko + "</span>";
  }).join("");

  return '<section class="geo-map">' +
    '<div class="geo-map-h"><h3>세계 커피 품종 지도</h3>' +
      '<span class="hint">나라마다 이 도감의 품종이 몇 종 자라는지 — 왼쪽 필터를 바꾸면 지도도 함께 바뀝니다. 나라를 누르면 아래 목록으로 내려갑니다.</span></div>' +
    '<div class="wm-wrap">' + wmSVG({ vb: [0, 0, WM.w, WM.h], px: 1100, fill: fill, label: "나라별 품종 수 지도" }) + "</div>" +
    '<div class="wm-legend"><span class="lab" style="margin-right:4px">품종 수</span>' + legend +
      '<span><i class="sw none"></i>없음</span></div>' +
    "</section>";
}

/* 대륙 · 국가 탭 — 기존 목록 위에 지도를 얹는다 */
VIEW_RENDERERS.geo = function () {
  renderGeo();
  var list = filtered(), byCountry = {};
  list.forEach(function (v) {
    (v.grow || []).forEach(function (c) { (byCountry[c] = byCountry[c] || []).push(v); });
  });
  var host = $("#view-geo");
  if (!Object.keys(byCountry).length) return;
  host.insertAdjacentHTML("afterbegin", geoMapHTML(byCountry));
  /* 지도에서 누른 나라의 카드를 찾을 수 있게 표시해 둔다 */
  $$("#view-geo .geo-card h4").forEach(function (h) {
    h.parentNode.setAttribute("data-geocard", h.firstChild.textContent);
  });
};

/* ── 말풍선 · 클릭 ─────────────────────────────── */
var wmTip = null;
function wmTipEl() {
  if (!wmTip) {
    wmTip = document.createElement("div");
    wmTip.className = "wm-tip";
    wmTip.setAttribute("role", "tooltip");
    document.body.appendChild(wmTip);
  }
  return wmTip;
}
document.addEventListener("mousemove", function (e) {
  var t = e.target && e.target.closest ? e.target.closest(".wmap [data-tip]") : null;
  var tip = wmTipEl();
  if (!t) { tip.classList.remove("on"); return; }
  tip.textContent = t.getAttribute("data-tip");
  var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  var y = e.clientY - tip.offsetHeight - 12;
  tip.style.left = x + "px";
  tip.style.top = (y < 8 ? e.clientY + 18 : y) + "px";
  tip.classList.add("on");
});
document.addEventListener("scroll", function () { if (wmTip) wmTip.classList.remove("on"); }, true);

document.addEventListener("click", function (e) {
  var t = e.target && e.target.closest ? e.target : null;
  if (!t) return;
  var el;
  if ((el = t.closest("[data-wmtoggle]"))) {
    var sec = el.closest(".sec");
    var z = sec.querySelector('[data-wmv="zoom"]'), w = sec.querySelector('[data-wmv="world"]');
    var toWorld = w.hidden;
    w.hidden = !toWorld; z.hidden = toWorld;
    el.textContent = toWorld ? "가까이 보기" : "세계 전체로 보기";
    return;
  }
  if ((el = t.closest("[data-geojump]"))) {
    var card = document.querySelector('[data-geocard="' + el.getAttribute("data-geojump") + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.remove("flash");
    void card.offsetWidth;          // 같은 나라를 다시 눌러도 깜빡이게
    card.classList.add("flash");
  }
});

/* ── 상세 이야기 ──────────────────────────────── */
function detailHTML(v) {
  var D = DETAIL[v.id];
  if (!D) return "";
  var html = "";

  if (D.look && D.look.length) {
    html += '<div class="sec"><span class="lab">알아보는 법</span><ul class="dt-list">' +
      D.look.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul></div>";
  }
  if (D.farm && Object.keys(D.farm).length) {
    html += '<div class="sec"><span class="lab">재배 특성</span><dl class="dt-farm">' +
      Object.keys(D.farm).map(function (k) {
        return '<div' + (k === "최적 고도" ? ' class="wide"' : "") + "><dt>" + esc(k) + "</dt><dd>" + esc(D.farm[k]) + "</dd></div>";
      }).join("") + "</dl>" +
      '<p class="hint" style="margin-top:7px">출처 · ' + esc(D.farmSrc || "World Coffee Research 품종 카탈로그") + "</p></div>";
  }
  if (D.cup) html += '<div class="sec"><span class="lab">컵과 가공</span><p class="body-t">' + esc(D.cup) + "</p></div>";
  if (D.regions && D.regions.length) {
    html += '<div class="sec"><span class="lab">산지별 이야기</span><div class="dt-regions">' +
      D.regions.map(function (r) {
        return '<div><button class="dt-rc" data-country="' + esc(r.c) + '">' + esc(r.c) + "</button><p>" + esc(r.t) + "</p></div>";
      }).join("") + "</div></div>";
  }
  if (D.facts && D.facts.length) {
    html += '<div class="sec"><span class="lab">알아두면 재미있는</span><ul class="dt-list facts">' +
      D.facts.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
  }
  return html;
}

function detailSourcesHTML(v) {
  var D = DETAIL[v.id];
  if (!D || !D.src || !D.src.length) return "";
  return '<div class="sec"><span class="lab">출처</span><ul class="dt-src">' +
    D.src.map(function (s) {

    }).join("") + "</ul></div>";
}


/* ===== 28-ux.js ===== */
/* ============================================================
   쓰기 편하게 — 상세 넘기기 · 뒤로가기 · 보던 화면 기억 · 맨 위로 · 탭 넘침 표시
   ============================================================ */

var K_VIEW = LSK + "-view";   // 마지막에 보던 탭 · 조건 (이 브라우저 전용 — 백업 대상 아님)
var TOP_BTN_AFTER = 900;      // 이만큼 내려가면 「맨 위로」가 나온다 (px)

/* ── 상세 창: 이전 · 다음 품종 ────────────────── */
var sheetSeq = [];            // 상세를 연 순간 보이던 목록 (필터 · 정렬 그대로)

function sheetNavSync(id) {
  var wasOpen = $("#sheet").classList.contains("open");
  if (!wasOpen || sheetSeq.indexOf(id) === -1) {
    sheetSeq = sorted(filtered()).map(function (v) { return v.id; });
  }
  var i = sheetSeq.indexOf(id);
  var nav = $("#sheetNav");
  if (!nav) return;
  if (i === -1 || sheetSeq.length < 2) { nav.hidden = true; return; }
  nav.hidden = false;
  $("#sheetPos").textContent = (i + 1) + " / " + sheetSeq.length;
  $("#sheetPrev").disabled = i === 0;
  $("#sheetNext").disabled = i === sheetSeq.length - 1;
}
function sheetStep(d) {
  var cur = sheetSeq.indexOf(sheetCurrent());
  var next = sheetSeq[cur + d];
  if (cur === -1 || !next) return;
  openSheet(next);
}
function sheetCurrent() { return $("#sheet").dataset.id || ""; }

$("#sheetPrev").addEventListener("click", function () { sheetStep(-1); });
$("#sheetNext").addEventListener("click", function () { sheetStep(1); });
document.addEventListener("keydown", function (e) {
  if (!$("#sheet").classList.contains("open") || $("#ed").classList.contains("open")) return;
  var inField = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); sheetStep(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); sheetStep(1); }
});

/* ── 뒤로가기 = 상세 창 닫기 (폰에서 도감 밖으로 나가 버리지 않게) ── */
function sheetHistPush() {
  try { history.pushState({ caSheet: 1 }, ""); } catch (e) { /* 막힌 환경 — 버튼으로만 닫힌다 */ }
}
function sheetHistPop() {
  /* 버튼 · 바깥 클릭으로 닫았을 때 — 쌓아 둔 기록 한 칸을 걷어 낸다 */
  if (history.state && history.state.caSheet) {
    try { history.back(); } catch (e) { /* 무시 */ }
  }
}
window.addEventListener("popstate", function () {
  if ($("#sheet").classList.contains("open")) closeSheet(true);
});

/* ── 마지막에 보던 탭 · 조건 기억 ─────────────── */
function saveViewState() {
  try {
    localStorage.setItem(K_VIEW, JSON.stringify({
      view: state.view, f: state.f, q: state.q, favOnly: state.favOnly
    }));
  } catch (e) { /* 저장 불가 환경 — 기억만 못 한다 */ }
}
function restoreViewState() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(K_VIEW) || "null"); } catch (e) { s = null; }
  if (!s) return;
  var keys = ["sp", "grp", "cont", "country", "band", "tag"];
  if (s.f && typeof s.f === "object") {
    keys.forEach(function (k) {
      var o = s.f[k] || {};
      state.f[k] = {};
      Object.keys(o).forEach(function (v) { if (o[v]) state.f[k][v] = 1; });
    });
  }
  if (typeof s.q === "string" && s.q) setQuery(s.q);
  if (s.favOnly) setFavOnly(true);
  if (s.view && VIEW_RENDERERS[s.view] && $('.tab[data-view="' + s.view + '"]')) state.view = s.view;
}

/* ── 제호 접기 — 내려가면 작게, 맨 위 근처로 오면 다시 크게 (문턱을 둘로 둬 깜빡임 방지) ── */
var MAST_FOLD = 140, MAST_UNFOLD = 24;
window.addEventListener("scroll", function () {
  var m = $(".masthead"), y = window.pageYOffset;
  if (!m) return;
  if (y > MAST_FOLD && !m.classList.contains("compact")) m.classList.add("compact");
  else if (y < MAST_UNFOLD && m.classList.contains("compact")) m.classList.remove("compact");
}, { passive: true });
(function () {
  var d = new Date(), el = $("#mastDate");
  var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
  if (el) el.textContent = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + wd + "요일";
})();

/* ── 디자인 — 매거진 하나로 고정 (2026-10-03, 다른 스킨 정리). 화이트 / 블랙은 달 버튼 ── */
document.documentElement.setAttribute("data-skin", "mag");
["-skin", "-skin-v2", "-skin-v3", "-skin-v4"].forEach(function (k) {
  try { localStorage.removeItem(LSK + k); } catch (e) { /* 무시 */ }
});

/* ── 맨 위로 ──────────────────────────────────── */
var topBtn = document.createElement("button");
topBtn.className = "to-top";
topBtn.type = "button";
topBtn.setAttribute("aria-label", "맨 위로");
topBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
document.body.appendChild(topBtn);
topBtn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
window.addEventListener("scroll", function () {
  topBtn.classList.toggle("on", window.pageYOffset > TOP_BTN_AFTER);
}, { passive: true });

/* ── 탭 줄이 넘칠 때 — 가장자리를 흐리게, 고른 탭은 보이는 곳으로 ── */
function syncTabFade() {
  var t = $(".tabs");
  if (!t) return;
  var more = t.scrollWidth - t.clientWidth;
  t.classList.toggle("fade-r", more > 2 && t.scrollLeft < more - 2);
  t.classList.toggle("fade-l", more > 2 && t.scrollLeft > 2);
}
function revealActiveTab() {
  var a = $('.tab[aria-selected="true"]'), t = $(".tabs");
  if (!a || !t || t.scrollWidth <= t.clientWidth) return;
  var l = a.offsetLeft - 12, r = a.offsetLeft + a.offsetWidth + 12;
  if (l < t.scrollLeft) t.scrollLeft = l;
  else if (r > t.scrollLeft + t.clientWidth) t.scrollLeft = r - t.clientWidth;
  syncTabFade();
}
$(".tabs").addEventListener("scroll", syncTabFade, { passive: true });
window.addEventListener("resize", syncTabFade);


/* ===== 28b-app.js ===== */
/* ============================================================
   휴대폰 앱 화면 (760px 이하) — 하단 탭 5개 · 탐색/더보기 메뉴 · 검색 열기 · 필터 창
   PC 화면은 건드리지 않는다. CSS 는 01-head.html 끝 「휴대폰 앱 화면」
   ============================================================ */

/* 하단 탭에 바로 두지 않은 화면 — 어느 메뉴에 들어 있는지 */
var APP_GROUP = { tree: "explore", alt: "explore", geo: "explore", cmp: "explore",
                  quiz: "more", story: "more", read: "more" };
var APP_MENUS = {
  explore: { title: "탐색", items: [
    { view: "tree", ko: "계통도", sub: "품종의 족보 — 어느 품종에서 갈라져 나왔나" },
    { view: "alt",  ko: "고도",   sub: "품종마다 잘 자라는 재배 고도" },
    { view: "geo",  ko: "대륙 · 국가", sub: "세계 지도 · 나라별 품종" },
    { view: "cmp",  ko: "비교",   sub: "담아 둔 품종을 나란히" }
  ] },
  more: { title: "더보기", items: [
    { view: "quiz",  ko: "학습",   sub: "품종 퀴즈" },
    { view: "story", ko: "이야기", sub: "커피가 걸어온 길 · 인물 · 상식" },
    { view: "read",  ko: "읽는 법", sub: "도감 보는 법 · 자료의 믿을 만한 정도" },
    { sep: true },
    { act: "fav",   ko: "즐겨찾기만 보기" },
    { attr: "data-newvar", ko: "품종 직접 추가" },
    { attr: "data-bksave", ko: "지금 백업" },
    { attr: "data-import", ko: "백업 불러오기" }
  ] }
};

function appMenuHTML(key) {
  var m = APP_MENUS[key];
  return '<div class="am-h"><b>' + esc(m.title) + '</b><button class="am-x" data-appclose="1" aria-label="닫기">닫기</button></div>' +
    '<div class="am-list">' + m.items.map(function (it) {
      if (it.sep) return '<div class="am-sep"></div>';
      var on = it.view && state.view === it.view;
      var extra = "";
      if (it.view === "cmp") extra = " <i>" + state.cmp.length + "</i>";
      if (it.act === "fav") extra = state.favOnly ? " <i>켜짐</i>" : "";
      var attr = it.view ? 'data-appview="' + it.view + '"' : it.act ? 'data-appact="' + it.act + '"' : it.attr + '="1"';
      return '<button class="am-it' + (on ? " on" : "") + '" ' + attr + ">" +
        "<span><b>" + esc(it.ko) + extra + "</b>" + (it.sub ? "<small>" + esc(it.sub) + "</small>" : "") + "</span></button>";
    }).join("") + "</div>";
}

function openAppMenu(key) {
  var m = $("#appMenu");
  m.innerHTML = appMenuHTML(key);
  m.hidden = false;
  $("#appScrim").hidden = false;
  document.body.classList.add("app-modal");
}
function closeAppLayers() {
  var m = $("#appMenu");
  if (m) m.hidden = true;
  var sb = $("#sidebar");
  if (sb && sb.classList.contains("open")) {
    sb.classList.remove("open");
    $("#sideToggle").setAttribute("aria-expanded", "false");
  }
  $("#appScrim").hidden = true;
  document.body.classList.remove("app-modal");
}

/* 지금 화면에 맞춰 하단 탭 표시 · 화면 이름표 (body[data-view]) */
function appShellSync() {
  var v = state.view;
  document.body.setAttribute("data-view", v);
  var grp = APP_GROUP[v];
  $$(".app-tab").forEach(function (b) {
    var on = b.dataset.view ? b.dataset.view === v : b.dataset.appmenu === grp;
    b.setAttribute("aria-current", on ? "page" : "false");
  });
  var t = $("#appTitle");
  if (t) {
    var name = { atlas: "", log: "기록", news: "소식", tree: "계통도", alt: "고도", geo: "대륙 · 국가",
                 cmp: "비교", quiz: "학습", story: "이야기", read: "읽는 법" }[v] || "";
    t.textContent = name;
  }
  /* 검색은 품종을 거르는 화면에서만 */
  if (!FILTER_VIEWS[v]) document.body.classList.remove("search-open");
}

/* 필터 창이 열리고 닫힐 때 뒤 화면 가림막 */
(function () {
  var sb = $("#sidebar");
  if (!sb || !window.MutationObserver) return;
  new MutationObserver(function () {
    var open = sb.classList.contains("open") && window.innerWidth <= 760;
    $("#appScrim").hidden = !open && $("#appMenu").hidden;
    document.body.classList.toggle("app-modal", open || !$("#appMenu").hidden);
  }).observe(sb, { attributes: true, attributeFilter: ["class"] });
})();

document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target : e.target.parentNode;
  if (!t || !t.closest) return;
  var el;
  if ((el = t.closest(".app-tab"))) {
    if (el.dataset.view) {
      closeAppLayers();
      if (state.view === el.dataset.view) window.scrollTo({ top: 0, behavior: "smooth" });   // 같은 탭을 다시 누르면 맨 위로
      else setView(el.dataset.view);
    } else openAppMenu(el.dataset.appmenu);
    return;
  }
  if ((el = t.closest("[data-appview]"))) { closeAppLayers(); setView(el.dataset.appview); return; }
  if ((el = t.closest("[data-appact]"))) {
    var a = el.dataset.appact;
    closeAppLayers();
    if (a === "fav") $("#favBtn").click();
    if (a === "theme") $("#themeBtn").click();
    return;
  }
  /* 메뉴 안의 백업 · 품종 추가 — 원래 기능이 처리하고, 메뉴는 닫는다 */
  if (t.closest("#appMenu [data-newvar], #appMenu [data-bksave], #appMenu [data-import]")) {
    setTimeout(closeAppLayers, 0);
    return;
  }
  if (t.closest("[data-appclose]") || t.closest("#appScrim")) { closeAppLayers(); return; }
  if ((el = t.closest("#searchBtn"))) {
    var open = !document.body.classList.contains("search-open");
    document.body.classList.toggle("search-open", open);
    if (open) setTimeout(function () { $("#q").focus(); }, 30);
    return;
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && document.body.classList.contains("app-modal")) closeAppLayers();
});

/* 품종 상세 — 「← 뒤로」 · 좌우로 밀어 이전/다음 품종 */
$("#sheetBack").addEventListener("click", function () { closeSheet(); });
(function () {
  var body = $("#sheetBody"), x0 = 0, y0 = 0, t0 = 0;
  var SWIPE_MIN = 70;           // 이만큼 이상 옆으로 밀어야 넘어간다 (px)
  body.addEventListener("touchstart", function (e) {
    var p = e.touches[0]; x0 = p.clientX; y0 = p.clientY; t0 = Date.now();
  }, { passive: true });
  body.addEventListener("touchend", function (e) {
    var p = e.changedTouches[0], dx = p.clientX - x0, dy = p.clientY - y0;
    if (Date.now() - t0 > 600 || Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 2) return;
    sheetStep(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* 확대 · 축소 막기 (사용자 요청 2026-10-03) — 앱처럼 화면이 고정되게
   아이폰 사파리는 viewport 의 user-scalable=no 를 무시해서, 손가락 모으기(gesture)를 직접 막는다.
   두 번 톡 확대는 CSS touch-action:manipulation 이 막는다 */
["gesturestart", "gesturechange"].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener("touchmove", function (e) {
  if (e.touches && e.touches.length > 1) e.preventDefault();   // 두 손가락 = 확대 시도
}, { passive: false });

appShellSync();


/* ===== 29-app-init.js ===== */
/* ============================================================
   코어 이벤트 연결 · 폰 설치 메타 · 초기화
   ============================================================ */

/* ── 코어 클릭 위임 ───────────────────────────── */
document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target : e.target.parentNode;
  if (!t || !t.closest) return;
  var el;

  if ((el = t.closest("[data-fav]"))) { e.stopPropagation(); toggleFav(el.dataset.fav); return; }
  if ((el = t.closest("[data-cmp]"))) { e.stopPropagation(); toggleCmp(el.dataset.cmp); return; }
  if ((el = t.closest("[data-cmpclear]"))) { state.cmp = []; renderAll(); return; }
  if ((el = t.closest("[data-go]"))) { openSheet(el.dataset.go); return; }

  if ((el = t.closest("[data-country]"))) {
    state.f.country = {}; state.f.country[el.dataset.country] = 1;
    closeSheet(); setView("atlas"); renderAll(); return;
  }
  if ((el = t.closest("[data-tag]"))) {
    state.f.tag = {}; state.f.tag[el.dataset.tag] = 1;
    closeSheet(); setView("atlas"); renderAll(); return;
  }
  if ((el = t.closest("[data-clear]"))) {
    var k = el.dataset.clear;
    if (k === "ALL") {
      state.f = { sp:{}, grp:{}, cont:{}, country:{}, band:{}, tag:{} };
      setQuery("");
      setFavOnly(false);
    } else state.f[k] = {};
    renderAll(); return;
  }
  /* 결과 위 칩 — 조건 하나만 푼다 */
  if ((el = t.closest("[data-unf]"))) { delete state.f[el.dataset.unf][el.dataset.unv]; renderAll(); return; }
  if ((el = t.closest("[data-unq]"))) { setQuery(""); renderAll(); return; }
  if ((el = t.closest("[data-unfav]"))) { setFavOnly(false); renderAll(); return; }
  if ((el = t.closest("[data-fmore]"))) {
    var mk = el.dataset.fmore;
    FACET_OPEN[mk] = !FACET_OPEN[mk];
    renderSidebar();
    if (!FACET_OPEN[mk]) {       // 접으면 버튼이 제자리에 오도록
      var mb = $('[data-fmore="' + mk + '"]');
      if (mb) mb.scrollIntoView({ block: "nearest" });
    }
    return;
  }
  if ((el = t.closest("[data-sidedone]"))) {
    $("#sidebar").classList.remove("open");
    $("#sideToggle").setAttribute("aria-expanded", "false");
    /* 위에 붙은 머리글 아래로 — 걸린 조건 칩 줄이 가려지지 않게 */
    var mh = $(".masthead"), cover = mh && getComputedStyle(mh).position === "sticky" ? mh.offsetHeight : 0;
    var top = $("#sideToggle").getBoundingClientRect().top + window.pageYOffset - cover - 10;
    window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    return;
  }
  if ((el = t.closest(".fbtn"))) {
    var fk = el.dataset.fk, fv = el.dataset.fv;
    if (state.f[fk][fv]) delete state.f[fk][fv]; else state.f[fk][fv] = 1;
    renderAll(); return;
  }
  if ((el = t.closest(".tab"))) { setView(el.dataset.view); return; }
  if ((el = t.closest(".card"))) { openSheet(el.dataset.id); return; }
});

/* ── 닫기 ─────────────────────────────────────── */
$("#scrim").addEventListener("click", function () {
  if ($("#ed").classList.contains("open")) closeEditor();
  if ($("#sheet").classList.contains("open")) closeSheet();
  $("#scrim").classList.remove("open");
});
$("#sheetClose").addEventListener("click", function () { closeSheet(); });
$("#edClose").addEventListener("click", closeEditor);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("#ed").classList.contains("open")) { closeEditor(); return; }
    if ($("#sheet").classList.contains("open")) { closeSheet(); return; }
  }
  /* Ctrl S — 페이지 저장 대신 내 기록을 백업한다 */
  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault(); quickBackup(); return;
  }
  var inField = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("card")) {
    e.preventDefault(); openSheet(e.target.dataset.id);
  }
});

/* ── 검색 · 정렬 · 즐겨찾기 · 테마 ────────────── */
var qTimer;
$("#q").addEventListener("input", function (e) {
  var val = e.target.value;
  $("#qclear").hidden = !val;
  clearTimeout(qTimer);
  qTimer = setTimeout(function () { state.q = val.trim(); renderAll(); }, 130);
});
function setQuery(v) {
  clearTimeout(qTimer);
  $("#q").value = v; $("#qclear").hidden = !v; state.q = v.trim();
}
$("#qclear").addEventListener("click", function () {
  setQuery(""); renderAll(); $("#q").focus();
});
/* 검색창에서 Esc — 검색어를 지운다 (비어 있으면 검색창에서 빠져나온다) */
$("#q").addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (this.value) { e.stopPropagation(); setQuery(""); renderAll(); }
  else this.blur();
});

$("#sort").addEventListener("change", function (e) {
  state.sort = e.target.value; saveStore(); renderView();
});

function setFavOnly(on) {
  state.favOnly = on;
  $("#favBtn").classList.toggle("on", on);
  $("#favBtn").setAttribute("aria-pressed", String(on));
}
$("#favBtn").addEventListener("click", function () {
  setFavOnly(!state.favOnly);
  renderAll();
});

function currentlyDark() {
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeColor() {
  var m = document.querySelector('meta[name="theme-color"]');
  var paper = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
  if (m) m.setAttribute("content", paper || (currentlyDark() ? "#17110D" : "#F5EFE6"));
}
$("#themeBtn").addEventListener("click", function () {
  var next = currentlyDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(LSK + "-theme", next); } catch (err) { /* 저장 불가 환경 */ }
  syncThemeColor();
});

$("#sideToggle").addEventListener("click", function () {
  var open = $("#sidebar").classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
});

/* ── 걸린 조건 칩 줄 — 머리글 높이만큼 내려 붙이고, 붙었을 때 그림자 ── */
function syncMastH() {
  var mh = $(".masthead");
  var h = mh && getComputedStyle(mh).position === "sticky" ? mh.offsetHeight : 0;
  document.documentElement.style.setProperty("--mast-h", h + "px");
}
syncMastH();
window.addEventListener("resize", syncMastH);
if (window.ResizeObserver) new ResizeObserver(syncMastH).observe($(".masthead"));
window.addEventListener("scroll", function () {
  var bar = $("#activeBar");
  if (!bar || bar.hidden) return;
  var top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mast-h")) || 0;
  bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= top + 0.5 && window.pageYOffset > 0);
}, { passive: true });

/* ── 폰 홈 화면 설치용 메타 ───────────────────── */
(function installMeta() {
  try {
    var head = document.head || document.getElementsByTagName("head")[0];
    if (!head) return;

    function addMeta(name, content) {
      if (document.querySelector('meta[name="' + name + '"]')) return;
      var m = document.createElement("meta");
      m.setAttribute("name", name);
      m.setAttribute("content", content);
      head.appendChild(m);
    }
    function addLink(rel, href) {
      var l = document.createElement("link");
      l.setAttribute("rel", rel);
      l.setAttribute("href", href);
      head.appendChild(l);
    }

    addMeta("apple-mobile-web-app-capable", "yes");
    addMeta("mobile-web-app-capable", "yes");
    addMeta("apple-mobile-web-app-status-bar-style", "default");
    addMeta("apple-mobile-web-app-title", "커피 도감");
    addMeta("theme-color", currentlyDark() ? "#17110D" : "#F5EFE6");

    // 홈 화면 아이콘 — 헤더에 쓰는 커피나무 마크를 캔버스로 그려 PNG 로 굽는다
    var icon = null;
    if (window.Path2D) {
      var c = document.createElement("canvas");
      c.width = c.height = 180;
      var g = c.getContext("2d");
      g.fillStyle = "#3B2A20";
      g.fillRect(0, 0, 180, 180);
      g.translate(30, 30);
      g.scale(5, 5);
      g.strokeStyle = "#F5EFE6";
      g.lineWidth = 1.5;
      g.lineJoin = "round";
      g.lineCap = "round";
      ["M12 21.5V7.5",
       "M12 12.5c0-3.3 2.9-6 6.5-6 0 3.3-2.9 6-6.5 6z",
       "M12 17c0-2.6-2.4-4.8-5.5-4.8C6.5 14.8 8.9 17 12 17z",
       "M12 7.8c0-2.6 1.9-4.6 4.3-4.6C16.3 5.8 14.4 7.8 12 7.8z"].forEach(function (d) {
        g.stroke(new Path2D(d));
      });
      icon = c.toDataURL("image/png");
      addLink("apple-touch-icon", icon);
      addLink("icon", icon);
    }

    var mf = {
      name: "커피 품종 도감",
      short_name: "커피 도감",
      display: "standalone",
      background_color: "#F5EFE6",
      theme_color: "#3B2A20",
      start_url: location.href
    };
    if (icon) mf.icons = [{ src: icon, sizes: "180x180", type: "image/png", purpose: "any" }];
    addLink("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(mf)));
  } catch (err) { /* 설치 메타는 없어도 도감 기능에는 영향이 없다 */ }
})();

if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncThemeColor);
}

/* ── 시작 ─────────────────────────────────────── */
loadStore();
loadLogs();
restoreViewState();           // 28-ux.js — 마지막에 보던 탭 · 조건
rebuildVarieties();
$("#sort").value = state.sort;
updateLogCount();
renderAll();
if (state.view !== "atlas") setView(state.view);
syncTabFade();
bkInit();

})();
</script>
</body>
</html>
